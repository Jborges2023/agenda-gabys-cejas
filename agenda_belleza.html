    <style>
        /* Estilos personalizados para sensación de App Nativa */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fce7f3; /* Rosa muy suave */
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Animaciones suaves */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Estilo para el contenedor de checkboxes de servicios */
        .service-checkboxes {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.5rem;
            background-color: #fff;
        }
        .service-checkboxes label {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.25rem;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .service-checkboxes label:hover {
            background-color: #fdf2f8; /* pink-50 */
        }
        .completed-appointment {
            opacity: 0.95; 
            background-color: #f0fdfa; /* Teal-50 */
        }
        .completed-appointment .text-pink-600 {
            color: #10b981; /* Teal-500 para el precio */
        }
    </style>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // --- CONFIGURACIÓN Y DATOS ---
        
        // Servicios predefinidos (ACTUALIZADOS)
        const servicesCatalog = [
            // Depilaciones
            { id: 10, name: "Bikini", price: 40000, duration: 20 },
            { id: 11, name: "Bozo", price: 5000, duration: 2 },
            { id: 12, name: "Menton", price: 5000, duration: 2 },
            { id: 13, name: "Depilación de Ceja", price: 20000, duration: 15 },
            { id: 14, name: "Depilación Brasilera", price: 55000, duration: 35 },
            { id: 15, name: "Depilación de Piernas completas", price: 80000, duration: 60 }, // 1 hora
            { id: 16, name: "Depilación media pierna", price: 40000, duration: 20 },
            // Cejas y Pestañas
            { id: 20, name: "Cejas con Henna (sin depilación)", price: 25000, duration: 20 },
            { id: 21, name: "Cejas con Henna", price: 35000, duration: 30 },
            { id: 22, name: "Lifting de Pestañas", price: 65000, duration: 90 }, // 1 hora y media
            { id: 23, name: "Laminado de Cejas", price: 60000, duration: 40 },
            { id: 24, name: "Pestañas Punto a Punto", price: 25000, duration: 20 },
            { id: 25, name: "Pestañas Pelo a Pelo", price: 120000, duration: 120 }, // 2 horas
            { id: 26, name: "Retoque Pestañas Pelo a Pelo", price: 55000, duration: 90 }, // 1 hora y media
            // Servicios especiales: permiten crear un ítem con nombre, precio y duración libres, escritos a mano
            { id: 998, name: "Servicio Personalizado", price: 0, duration: 0, isCustom: true, emoji: '📝' },
            { id: 999, name: "Promoción", price: 0, duration: 0, isCustom: true, emoji: '🎉' }
        ];

        // Estado de la aplicación
        let appointments = JSON.parse(localStorage.getItem('beautyAppointments')) || [];
        let staffMembers = JSON.parse(localStorage.getItem('beautyStaff')) || ['Gaby'];
        let clientsDB = JSON.parse(localStorage.getItem('beautyClients')) || [];
        let currentView = 'agenda';
        let currentCitasSubView = 'pendientes'; // Controla la sub-vista de Citas
        let pendingAction = null; // Para el modal de confirmación
        let currentFinanceSubView = 'resumen'; // Sub-vista de Finanzas

        const saveClientsDB = () => localStorage.setItem('beautyClients', JSON.stringify(clientsDB));

        // Migración: si ya tenías citas guardadas antes de que existiera esta base de datos de clientas,
        // creamos su perfil automáticamente (sin teléfono, lo puedes completar tú luego editándolas)
        (function migrateClientsFromAppointments() {
            let changed = false;
            const existingNames = new Set(clientsDB.map(c => c.name.toLowerCase()));
            appointments.forEach(a => {
                const name = (a.client || '').trim();
                if (name && !existingNames.has(name.toLowerCase())) {
                    clientsDB.push({ id: Date.now() + Math.floor(Math.random() * 1000), name, phone: '', notes: '', createdAt: a.timestamp || Date.now() });
                    existingNames.add(name.toLowerCase());
                    changed = true;
                }
            });
            if (changed) saveClientsDB();
        })();

        const findClientByName = (name) => clientsDB.find(c => c.name.toLowerCase() === (name || '').trim().toLowerCase());

        // Crea el perfil de la clienta si no existe, o no hace nada si ya existía (su historial se calcula solo, a partir de sus citas)
        const upsertClient = (name, phone, notes) => {
            const existing = findClientByName(name);
            if (existing) {
                // Si ya existía pero no tenía teléfono/notas y ahora se proporcionaron, los completamos
                if (phone && !existing.phone) existing.phone = phone;
                if (notes && !existing.notes) existing.notes = notes;
                saveClientsDB();
                return existing;
            }
            const newClient = { id: Date.now(), name: name.trim(), phone: (phone || '').trim(), notes: (notes || '').trim(), createdAt: Date.now() };
            clientsDB.push(newClient);
            saveClientsDB();
            return newClient;
        };

        // --- BUSCADOR DE CLIENTAS CON AUTOCOMPLETADO ---
        window.handleClientNameInput = (value) => {
            const query = value.trim().toLowerCase();
            const suggestionsBox = document.getElementById('clientSuggestions');
            const matchedBadge = document.getElementById('clientMatchedBadge');
            const newClientExtra = document.getElementById('newClientExtra');
            const selectedIdInput = document.getElementById('selectedClientId');

            // Si el texto cambia, invalidamos cualquier selección previa hasta que vuelva a coincidir o se elija de la lista
            selectedIdInput.value = '';
            matchedBadge.classList.add('hidden');

            if (query.length === 0) {
                suggestionsBox.classList.add('hidden');
                newClientExtra.classList.add('hidden');
                return;
            }

            const matches = clientsDB.filter(c => c.name.toLowerCase().includes(query)).slice(0, 6);

            if (matches.length > 0) {
                suggestionsBox.innerHTML = matches.map(c => `
                    <button type="button" onclick="window.selectClientSuggestion(${c.id})" class="w-full text-left px-3 py-2.5 hover:bg-pink-50 border-b border-gray-50 last:border-0 flex items-center justify-between">
                        <span class="text-sm text-gray-800">${c.name}</span>
                        ${c.phone ? `<span class="text-xs text-gray-400">${c.phone}</span>` : ''}
                    </button>
                `).join('');
                suggestionsBox.classList.remove('hidden');
            } else {
                suggestionsBox.classList.add('hidden');
            }

            // Si lo escrito coincide EXACTO con una clienta existente, la damos por seleccionada automáticamente
            const exactMatch = findClientByName(value);
            if (exactMatch) {
                selectedIdInput.value = exactMatch.id;
                matchedBadge.classList.remove('hidden');
                newClientExtra.classList.add('hidden');
            } else {
                // No existe todavía -> es una clienta nueva, mostramos campos opcionales de teléfono/nota
                newClientExtra.classList.remove('hidden');
            }
            lucide.createIcons();
        };

        window.selectClientSuggestion = (clientId) => {
            const client = clientsDB.find(c => c.id === clientId);
            if (!client) return;
            document.getElementById('clientName').value = client.name;
            document.getElementById('selectedClientId').value = client.id;
            document.getElementById('clientSuggestions').classList.add('hidden');
            document.getElementById('newClientExtra').classList.add('hidden');
            document.getElementById('clientMatchedBadge').classList.remove('hidden');
            lucide.createIcons();
        };

        // --- IMPORTAR CONTACTO DEL TELÉFONO (Contact Picker API) ---
        // Disponible solo en Chrome para Android (con HTTPS). iPhone/Safari y computadores no lo soportan,
        // por restricción de Apple/navegadores de escritorio, no de esta app.
        window.pickPhoneContact = async () => {
            const supported = ('contacts' in navigator) && ('ContactsManager' in window);
            if (!supported) {
                showToast('Tu navegador no permite abrir los contactos del teléfono (solo funciona en Chrome para Android). Puedes escribir el nombre manualmente.');
                return;
            }
            try {
                const props = ['name', 'tel'];
                const opts = { multiple: false };
                const contacts = await navigator.contacts.select(props, opts);
                if (!contacts || contacts.length === 0) return;

                const contact = contacts[0];
                const contactName = (contact.name && contact.name[0]) || '';
                const contactTel = (contact.tel && contact.tel[0]) || '';

                if (!contactName) {
                    showToast('Ese contacto no tiene nombre guardado.');
                    return;
                }

                document.getElementById('clientName').value = contactName;
                window.handleClientNameInput(contactName);

                // Si es clienta nueva (no encontrada en la base), precargamos su teléfono del contacto
                const newClientExtra = document.getElementById('newClientExtra');
                if (!newClientExtra.classList.contains('hidden') && contactTel) {
                    document.getElementById('newClientPhone').value = contactTel;
                }
            } catch (err) {
                // El usuario canceló el selector, o el navegador lo bloqueó; no hace falta mostrar error en ese caso
                if (err && err.name !== 'AbortError') {
                    console.error('Error al abrir contactos:', err);
                    showToast('No se pudo abrir tus contactos.');
                }
            }
        };

        // Cierra el desplegable de sugerencias al tocar fuera de él
        document.addEventListener('click', (e) => {
            const suggestionsBox = document.getElementById('clientSuggestions');
            const input = document.getElementById('clientName');
            if (!suggestionsBox || !input) return;
            if (!suggestionsBox.contains(e.target) && e.target !== input) {
                suggestionsBox.classList.add('hidden');
            }
        });

        // --- SERVICIOS PERSONALIZADOS (nombre, precio y duración libres, escritos a mano) ---
        // idPrefix: '' para el formulario de Agendar, 'edit' para el modal de Editar
        // Cada servicio personalizado (Promoción, Servicio Personalizado, etc.) tiene sus propios campos,
        // identificados por su id de catálogo, para que puedan coexistir sin pisarse entre sí.
        const renderServiceCheckboxItem = (s, checkboxName, idPrefix, isChecked, updateFnName) => {
            if (s.isCustom) {
                const base = `${idPrefix}Custom${s.id}`;
                return `
                    <div class="border border-dashed border-pink-300 rounded-lg p-2.5 mt-1 bg-pink-50/50">
                        <label class="flex items-center">
                            <input type="checkbox" name="${checkboxName}" value="${s.id}" data-price="0" data-duration="0" data-custom="true"
                                id="${base}Checkbox" onchange="window.toggleCustomFields('${idPrefix}', ${s.id}); window.${updateFnName}()" class="mr-2 text-pink-500 focus:ring-pink-500 rounded" ${isChecked ? 'checked' : ''}>
                            <span class="font-medium text-pink-600">${s.emoji || '✨'} ${s.name}</span>
                        </label>
                        <div id="${base}Fields" class="mt-2 space-y-2 ${isChecked ? '' : 'hidden'}">
                            <input type="text" id="${base}Name" placeholder="Nombre del servicio" class="w-full p-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none" oninput="window.${updateFnName}()">
                            <input type="number" id="${base}Price" placeholder="Precio ($)" min="0" class="w-full p-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none" oninput="window.${updateFnName}()">
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Duración</label>
                                <div class="flex gap-2 items-center">
                                    <input type="number" id="${base}DurationHours" placeholder="0" min="0" class="w-1/2 p-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none" oninput="window.${updateFnName}()">
                                    <span class="text-xs text-gray-400 shrink-0">horas</span>
                                    <input type="number" id="${base}DurationMinutes" placeholder="0" min="0" max="59" class="w-1/2 p-2 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none" oninput="window.${updateFnName}()">
                                    <span class="text-xs text-gray-400 shrink-0">min</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            return `
                <label>
                    <input type="checkbox" name="${checkboxName}" value="${s.id}" data-price="${s.price}" data-duration="${s.duration}" onchange="window.${updateFnName}()" class="mr-2 text-pink-500 focus:ring-pink-500 rounded" ${isChecked ? 'checked' : ''}>
                    ${s.name} (${formatCurrency(s.price)})
                </label>
            `;
        };

        // Muestra/oculta los campos de nombre/precio/duración de un servicio personalizado específico (por id)
        window.toggleCustomFields = (idPrefix, id) => {
            const base = `${idPrefix}Custom${id}`;
            const checkbox = document.getElementById(`${base}Checkbox`);
            const fields = document.getElementById(`${base}Fields`);
            if (!checkbox || !fields) return;
            fields.classList.toggle('hidden', !checkbox.checked);
        };

        // Lee un checkbox personalizado (por id) + sus campos y arma un objeto de servicio, o {incomplete:true} si falta algo
        const getCustomServiceData = (idPrefix, id) => {
            const base = `${idPrefix}Custom${id}`;
            const checkbox = document.getElementById(`${base}Checkbox`);
            if (!checkbox || !checkbox.checked) return null;

            const catalogEntry = servicesCatalog.find(s => s.id === id) || {};
            const nameEl = document.getElementById(`${base}Name`);
            const priceEl = document.getElementById(`${base}Price`);
            const hoursEl = document.getElementById(`${base}DurationHours`);
            const minutesEl = document.getElementById(`${base}DurationMinutes`);

            const name = (nameEl.value || '').trim();
            const price = parseInt(priceEl.value) || 0;
            const hours = parseInt(hoursEl.value) || 0;
            const minutes = parseInt(minutesEl.value) || 0;
            const duration = (hours * 60) + minutes; // Total guardado siempre en minutos

            if (!name || price <= 0 || duration <= 0) {
                return { incomplete: true };
            }
            return { id, name: `${catalogEntry.emoji || '✨'} ${name}`, price, duration, isCustom: true };
        };

        // --- FUNCIONES DE AUDIO (TONE.JS) ---
        let audioInitialized = false;
        let synth;

        const initAudio = () => {
            if (!audioInitialized) {
                if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                    Tone.start().then(() => {
                        console.log("AudioContext iniciado.");
                        audioInitialized = true;
                        synth = new Tone.PolySynth(Tone.Synth, {
                            oscillator: { type: "sine" },
                            envelope: {
                                attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5,
                            },
                            volume: -8
                        }).toDestination();
                    });
                } else if (typeof Tone !== 'undefined') {
                    audioInitialized = true;
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sine" },
                        envelope: {
                            attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5,
                        },
                        volume: -8
                    }).toDestination();
                }
            }
        };

        const playConfirmationSound = () => {
            if (audioInitialized && synth) {
                synth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
            } else {
                initAudio();
            }
        };

        // Sonidos predefinidos para notificaciones de cita (generados con Tone.js, no requieren descargar nada)
        const NOTIFICATION_PRESETS = {
            campana: { label: '🔔 Campana', notes: ["C6", "G5"], duration: "4n" },
            suave: { label: '🎐 Suave', notes: ["E5", "C5"], duration: "8n" },
            alerta: { label: '⏰ Alerta', notes: ["A5", "A5", "A5"], duration: "16n" },
            xilofono: { label: '🎵 Xilófono', notes: ["C6", "E6", "G6", "C7"], duration: "8n" }
        };

        const playPresetSound = (presetKey) => {
            initAudio();
            const preset = NOTIFICATION_PRESETS[presetKey] || NOTIFICATION_PRESETS.campana;
            const tryPlay = () => {
                if (audioInitialized && synth) {
                    if (presetKey === 'alerta') {
                        // Tres golpes cortos, tipo alarma
                        let t = 0;
                        preset.notes.forEach(note => {
                            setTimeout(() => synth.triggerAttackRelease(note, preset.duration), t);
                            t += 250;
                        });
                    } else {
                        synth.triggerAttackRelease(preset.notes, preset.duration);
                    }
                } else {
                    setTimeout(tryPlay, 200);
                }
            };
            tryPlay();
        };
        // --- FIN FUNCIONES DE AUDIO ---

        // --- ALMACENAMIENTO DEL SONIDO PERSONALIZADO (IndexedDB, soporta archivos grandes tipo canción) ---
        const CUSTOM_SOUND_DB = 'gabycejas-sounds';
        const openSoundDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(CUSTOM_SOUND_DB, 1);
            req.onupgradeneeded = () => req.result.createObjectStore('sounds');
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const saveCustomSound = async (file) => {
            const db = await openSoundDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('sounds', 'readwrite');
                tx.objectStore('sounds').put({ blob: file, name: file.name }, 'customNotificationSound');
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        };

        const getCustomSound = async () => {
            const db = await openSoundDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('sounds', 'readonly');
                const req = tx.objectStore('sounds').get('customNotificationSound');
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        };

        let customSoundAudioEl = null;
        const playCustomSound = async () => {
            try {
                const data = await getCustomSound();
                if (!data) { showToast('No has subido ningún sonido personalizado todavía.'); return; }
                const url = URL.createObjectURL(data.blob);
                if (customSoundAudioEl) { customSoundAudioEl.pause(); }
                customSoundAudioEl = new Audio(url);
                customSoundAudioEl.play().catch(() => {});
            } catch (err) {
                console.error('Error reproduciendo sonido personalizado:', err);
            }
        };

        // --- FUNCIONES UTILITARIAS ---

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(amount);
        };

        const formatDate = (dateString) => {
            // Manejar fechas en formato YYYY-MM-DD
            const [year, month, day] = dateString.split('-');
            // Cuidado con la zona horaria al crear la fecha
            const date = new Date(year, month - 1, day, 12); // Usar 12 PM para evitar problemas de TZ
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('es-ES', options);
        };
        
        const formatMonthYear = (dateString) => {
            // Convierte YYYY-MM a "Nombre del Mes, YYYY"
            const [year, monthNum] = dateString.split('-');
            const date = new Date(year, monthNum - 1);
            return date.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
        };

        // Convierte "HH:MM" (24h) a "h:MM AM/PM" para mostrar siempre en formato 12h, sin importar el idioma/región del dispositivo
        const formatTime12 = (timeString) => {
            if (!timeString) return '';
            const [h, m] = timeString.split(':').map(Number);
            const period = h >= 12 ? 'PM' : 'AM';
            let hour12 = h % 12;
            if (hour12 === 0) hour12 = 12;
            return `${hour12}:${String(m).padStart(2, '0')} ${period}`;
        };

        // --- SELECTOR DE HORA PERSONALIZADO (12h con AM/PM, minuto a minuto) ---
        // Reemplaza <input type="time"> porque ese control nativo usa el formato de 24h (militar)
        // o pasos de varios minutos según el sistema operativo del celular, algo que no podemos controlar.
        // Con selects propios garantizamos siempre 12h + AM/PM y minuto exacto en cualquier dispositivo.
        const buildTimePicker = (prefix) => {
            let hourOptions = '';
            for (let h = 1; h <= 12; h++) hourOptions += `<option value="${h}">${h}</option>`;
            let minuteOptions = '';
            for (let m = 0; m < 60; m++) minuteOptions += `<option value="${m}">${String(m).padStart(2, '0')}</option>`;

            return `
                <div class="flex gap-1.5">
                    <select id="${prefix}Hour" onchange="window.syncTimePicker('${prefix}')" class="w-1/3 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none bg-white text-sm text-center">${hourOptions}</select>
                    <select id="${prefix}Minute" onchange="window.syncTimePicker('${prefix}')" class="w-1/3 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none bg-white text-sm text-center">${minuteOptions}</select>
                    <select id="${prefix}Period" onchange="window.syncTimePicker('${prefix}')" class="w-1/3 p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none bg-white text-sm text-center">
                        <option value="AM">AM ☀️</option>
                        <option value="PM">PM 🌙</option>
                    </select>
                </div>
                <input type="hidden" id="${prefix}">
            `;
        };

        // Lee los 3 selects y arma el valor 24h "HH:MM" en el input oculto
        window.syncTimePicker = (prefix) => {
            const hourEl = document.getElementById(`${prefix}Hour`);
            const minuteEl = document.getElementById(`${prefix}Minute`);
            const periodEl = document.getElementById(`${prefix}Period`);
            const hiddenEl = document.getElementById(prefix);
            if (!hourEl || !minuteEl || !periodEl || !hiddenEl) return;

            let hour = parseInt(hourEl.value);
            const minute = parseInt(minuteEl.value);
            const period = periodEl.value;

            if (period === 'AM') {
                if (hour === 12) hour = 0;
            } else {
                if (hour !== 12) hour += 12;
            }
            hiddenEl.value = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        };

        // Configura los 3 selects a partir de un valor "HH:MM" en 24h (usado al editar una cita o al poner la hora actual por defecto)
        window.setTimePickerValue = (prefix, timeString) => {
            const [h, m] = timeString.split(':').map(Number);
            const period = h >= 12 ? 'PM' : 'AM';
            let hour12 = h % 12;
            if (hour12 === 0) hour12 = 12;

            const hourEl = document.getElementById(`${prefix}Hour`);
            const minuteEl = document.getElementById(`${prefix}Minute`);
            const periodEl = document.getElementById(`${prefix}Period`);
            if (!hourEl || !minuteEl || !periodEl) return;

            hourEl.value = hour12;
            minuteEl.value = m;
            periodEl.value = period;
            window.syncTimePicker(prefix);
        };

        const showToast = (message) => {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        };

        const saveData = () => {
            localStorage.setItem('beautyAppointments', JSON.stringify(appointments));
            // Recargar vistas que dependen de los datos locales
            if (currentView === 'finanzas' && currentFinanceSubView === 'resumen') renderFinanzasResumen(document.getElementById('financeContent'));
            if (currentView === 'finanzas' && currentFinanceSubView === 'historial') renderFinanzasHistorial(document.getElementById('financeContent')); 
            if (currentView === 'finanzas' && currentFinanceSubView === 'equipo') renderFinanzasEquipo(document.getElementById('financeContent'));
            if (currentView === 'citas') setCitasSubView(currentCitasSubView); // Asegura que la lista de citas se actualice
            if (currentView === 'clientes') renderClientes(document.getElementById('mainContent'));
        };
        
        const formatDuration = (totalMinutes) => {
            if (totalMinutes === 0) return "0 min";
            
            if (totalMinutes >= 60) {
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                
                let parts = [];
                if (hours > 0) parts.push(`${hours} hora${hours > 1 ? 's' : ''}`);
                if (minutes > 0) parts.push(`${minutes} min`);

                if (parts.length === 2) return `${parts[0]} y ${parts[1]}`;
                return parts.join(' ');
                
            } else {
                return `${totalMinutes} min`;
            }
        };


        // --- FUNCIÓN PARA EL DESPLEGABLE DE SERVICIOS ---
        window.toggleServicesDropdown = (containerId, iconId) => {

        // --- LÓGICA DEL MODAL DE CONFIRMACIÓN (Eliminar, Completar) ---

        const showConfirmationModal = (message, onConfirm) => {

        // --- GESTIÓN DE EQUIPO / PROFESIONALES ---

        const saveStaff = () => {
            localStorage.setItem('beautyStaff', JSON.stringify(staffMembers));
        };

        const renderStaffList = () => {

            `).join('');

        };

        window.addStaffMember = () => {
            const input = document.getElementById('newStaffName');

        window.hideSettingsModal = () => {
            const modal = document.getElementById('settingsModal');
            modal.classList.add('pointer-events-none', 'opacity-0');
            modal.querySelector('div').classList.add('scale-95');
        };

        // --- NOTIFICACIONES DE CITAS ---
        // IMPORTANTE: esto avisa mientras la app esté abierta (aunque sea en segundo plano en el navegador).
        // Con el celular bloqueado o la app totalmente cerrada no es posible sin un servidor de notificaciones push.
        let notifSettings = JSON.parse(localStorage.getItem('notifSettings')) || { enabled: false, soundType: 'campana' };

        const saveNotifSettings = () => localStorage.setItem('notifSettings', JSON.stringify(notifSettings));

        const renderNotificationSettings = async () => {
            const container = document.getElementById('notificationSettingsContainer');
            if (!container) return;

            const permission = ('Notification' in window) ? Notification.permission : 'unsupported';
            const customSound = await getCustomSound().catch(() => null);

            let permissionNote = '';
            if (permission === 'denied') {
                permissionNote = `<p class="text-[11px] text-red-500 mt-1">Bloqueaste las notificaciones para esta app en tu navegador. Actívalas desde los ajustes del navegador para poder recibir avisos.</p>`;
            } else if (permission === 'unsupported') {
                permissionNote = `<p class="text-[11px] text-red-500 mt-1">Tu navegador no soporta notificaciones. Igual sonará el aviso mientras la app esté abierta.</p>`;
            }

            container.innerHTML = `
                <label class="flex items-center justify-between p-3 rounded-lg border border-gray-200">
                    <span class="text-sm text-gray-700">Avisar cuando llegue la hora de la cita</span>
                    <input type="checkbox" id="notifEnabledToggle" ${notifSettings.enabled ? 'checked' : ''} onchange="window.toggleNotifications(this.checked)" class="w-5 h-5 text-pink-500 focus:ring-pink-500 rounded">
                </label>
                ${permissionNote}
                <p class="text-[11px] text-gray-400 px-1">Funciona mientras la app esté abierta (aunque sea en segundo plano). Con el celular bloqueado no se puede sin un servidor de notificaciones.</p>

                <div class="mt-2">
                    <label class="block text-xs font-medium text-gray-600 mb-1">Sonido de la notificación</label>
                    <select id="notifSoundSelect" onchange="window.changeNotifSound(this.value)" class="w-full p-2.5 text-sm rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-400 outline-none bg-white">
                        ${Object.entries(NOTIFICATION_PRESETS).map(([key, p]) => `<option value="${key}" ${notifSettings.soundType === key ? 'selected' : ''}>${p.label}</option>`).join('')}
                        <option value="custom" ${notifSettings.soundType === 'custom' ? 'selected' : ''}>🎶 Sonido/canción personalizado${customSound ? ' — ' + customSound.name : ''}</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <button onclick="window.previewNotifSound()" class="flex-1 flex items-center justify-center gap-1 p-2.5 rounded-lg border border-gray-200 hover:bg-pink-50 text-sm text-gray-700">
                        <i data-lucide="volume-2" class="w-4 h-4"></i> Probar sonido
                    </button>
                    <label class="flex-1 flex items-center justify-center gap-1 p-2.5 rounded-lg border border-gray-200 hover:bg-pink-50 text-sm text-gray-700 cursor-pointer">
                        <i data-lucide="music" class="w-4 h-4"></i> Subir tono
                        <input type="file" id="customSoundInput" accept="audio/*" class="hidden" onchange="window.uploadCustomSound(event)">
                    </label>
                </div>
            `;
            lucide.createIcons();
        };

        window.toggleNotifications = async (checked) => {
            if (checked) {
                if ('Notification' in window) {
                    const perm = await Notification.requestPermission();
                    if (perm !== 'granted') {
                        showToast('Sin permiso de notificaciones, solo sonará mientras la app esté abierta.');
                    }
                }
                notifSettings.enabled = true;
                showToast('Notificaciones de citas activadas.');
            } else {
                notifSettings.enabled = false;
                showToast('Notificaciones de citas desactivadas.');
            }
            saveNotifSettings();
            renderNotificationSettings();
        };

        window.changeNotifSound = (value) => {
            notifSettings.soundType = value;
            saveNotifSettings();
        };

        window.previewNotifSound = () => {
            if (notifSettings.soundType === 'custom') {
                playCustomSound();
            } else {
                playPresetSound(notifSettings.soundType);
            }
        };

        window.uploadCustomSound = async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 15 * 1024 * 1024) {
                showToast('Ese archivo es muy pesado (máx. 15 MB). Elige un tono más corto.');
                event.target.value = '';
                return;
            }
            try {
                await saveCustomSound(file);
                notifSettings.soundType = 'custom';
                saveNotifSettings();
                showToast(`"${file.name}" guardado como tu tono de notificación.`);
                renderNotificationSettings();
            } catch (err) {
                console.error('Error guardando sonido personalizado:', err);
                showToast('No se pudo guardar el archivo. Intenta con uno más liviano.');
            } finally {
                event.target.value = '';
            }
        };

        const playNotificationSound = () => {
            if (notifSettings.soundType === 'custom') {
                playCustomSound();
            } else {
                playPresetSound(notifSettings.soundType);
            }
        };

        // Revisa cada 20 segundos si alguna cita agendada llegó a su hora, y avisa una sola vez por cita
        let notifiedAppointmentIds = JSON.parse(localStorage.getItem('notifiedAppointmentIds')) || [];
        const markAsNotified = (id) => {
            notifiedAppointmentIds.push(id);
            // Solo guardamos los últimos 500 para no crecer indefinidamente
            if (notifiedAppointmentIds.length > 500) notifiedAppointmentIds = notifiedAppointmentIds.slice(-500);
            localStorage.setItem('notifiedAppointmentIds', JSON.stringify(notifiedAppointmentIds));
        };

        const checkAppointmentsDue = () => {
            if (!notifSettings.enabled) return;
            const now = Date.now();

            appointments.forEach(app => {
                if (app.status !== 'scheduled') return;
                if (notifiedAppointmentIds.includes(app.id)) return;

                // Ventana de 60 segundos desde la hora exacta de la cita
                if (now >= app.timestamp && now - app.timestamp < 60000) {
                    markAsNotified(app.id);
                    playNotificationSound();

                    const title = `¡Es hora de la cita de ${app.client}!`;
                    const body = `${app.serviceName} · ${formatTime12(app.time)}`;

                    if ('Notification' in window && Notification.permission === 'granted') {
                        try {
                            new Notification(title, { body, icon: './icon-192.png', tag: `cita-${app.id}` });
                        } catch (err) {
                            showToast(title);
                        }
                    } else {
                        showToast(title);
                    }
                }
            });
        };

        setInterval(checkAppointmentsDue, 20000);
        // --- FIN NOTIFICACIONES DE CITAS ---

        // Exportar todas las citas a un archivo .json descargable
        window.exportBackup = () => {
            if (appointments.length === 0) {
                showToast('No hay citas para exportar todavía.');
                return;
            }
            const backup = {
                app: 'gabycejas-agenda',
                exportedAt: new Date().toISOString(),
                appointments: appointments
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `respaldo-gabycejas-${fecha}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Respaldo descargado con éxito.');

        // Importar citas desde un archivo .json (fusiona con las citas existentes evitando duplicados por id)
        window.importBackup = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    const importedAppointments = Array.isArray(data) ? data : data.appointments;

                    if (!Array.isArray(importedAppointments)) {
                        throw new Error('Formato inválido');
                    }

                    const existingIds = new Set(appointments.map(a => a.id));
                    let addedCount = 0;

                    importedAppointments.forEach(imp => {
                        if (imp && typeof imp.id !== 'undefined' && !existingIds.has(imp.id)) {
                            appointments.push(imp);
                            existingIds.add(imp.id);
                            addedCount++;
                        }
                    });

                    saveData();
                    router(currentView);
                    hideSettingsModal();
                    showToast(addedCount > 0 ? `${addedCount} cita(s) importada(s) con éxito.` : 'El respaldo no tenía citas nuevas.');
                } catch (err) {
                    console.error('Error al importar respaldo:', err);

                } finally {
                    event.target.value = '';

            reader.readAsText(file);

        // Resetear la app por completo (borra TODOS los datos de este dispositivo: citas, clientas, equipo y notificaciones)
        window.confirmResetApp = () => {

        // --- LÓGICA DEL MODAL DE EDICIÓN ---
        
        const showEditModal = (appointmentId) => {
            const appointment = appointments.find(a => a.id === appointmentId);

            // No permitir editar si ya está completada

            document.getElementById('editAppointmentId').value = appointment.id;

            document.getElementById('editTimePickerContainer').innerHTML = buildTimePicker('editTime');

        // 3. VISTA CLIENTES FRECUENTES
        const renderClientes = (container) => {
            const clientsMap = {};
            const RECENT_WINDOW_MS = 90 * 24 * 60 * 60 * 1000; // Ventana de "actividad reciente": 90 días
            const now = Date.now();
            
            // Solo contamos visitas y gastos de citas COMPLETED
            const completedAppointments = appointments.filter(a => a.status === 'completed');

            completedAppointments.forEach(app => {
                const name = app.client.trim(); 
                if (!clientsMap[name]) {
                    clientsMap[name] = { name: name, count: 0, totalSpent: 0, lastVisit: 0, recentCount: 0, recentSpent: 0 };
                }
                clientsMap[name].count++;
                clientsMap[name].totalSpent += app.price; 
                // Usamos el timestamp de la cita para determinar la última visita
                if (app.timestamp > clientsMap[name].lastVisit) {
                    clientsMap[name].lastVisit = app.timestamp;
                }
                // Actividad reciente: solo visitas dentro de los últimos 90 días cuentan para el ranking del Top 3
                if (now - app.timestamp <= RECENT_WINDOW_MS) {
                    clientsMap[name].recentCount++;
                    clientsMap[name].recentSpent += app.price;
                }
            });

            // Ordenar clientes: 1ro por actividad reciente (frecuencia últimos 3 meses), 2do gasto reciente,

            // reciente cae a 0 y pierde su puesto automáticamente frente a clientas más activas.
            const clientsArray = Object.values(clientsMap).sort((a, b) => {
                if (b.recentCount !== a.recentCount) return b.recentCount - a.recentCount;
                if (b.recentSpent !== a.recentSpent) return b.recentSpent - a.recentSpent;
                if (b.totalSpent !== a.totalSpent) return b.totalSpent - a.totalSpent;

        // --- DETALLE DE CLIENTA (últimа visita + historial de gasto total) ---

            }

        }

        // 4a. VISTA FINANZAS - RESUMEN (Cálculos de citas locales)
        const renderFinanzasResumen = (container) => {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            let totalDay = 0;
            let totalWeek = 0;
            let totalQuincena = 0;
            let totalMonth = 0;
            
            // --- FILTRO CRUCIAL: SOLO CITAS COMPLETADAS ---
            const completedAppointments = appointments.filter(a => a.status === 'completed');
            // ---------------------------------------------------

            // Calcular el inicio de la semana (Domingo 0, Lunes 1, etc.)
            const dayOfWeek = now.getDay(); 
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - dayOfWeek); 
            startOfWeek.setHours(0,0,0,0);

            // Calcular el inicio de la quincena (Día 1 o Día 16)
            const dayOfMonth = now.getDate();
            const startQuincena = new Date(now.getFullYear(), now.getMonth(), dayOfMonth <= 15 ? 1 : 16);
            startQuincena.setHours(0,0,0,0); // Aseguramos medianoche
            
            // Obtener el inicio del mes actual
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            startOfMonth.setHours(0,0,0,0);

            completedAppointments.forEach(app => {
                // appDate debe ser un objeto Date para comparaciones, usando 12PM para evitar problemas de TZ
                const appDate = new Date(app.date + 'T12:00:00'); 
                const appDateOnly = app.date; // YYYY-MM-DD

                
                // Ganancia del Día
                if (appDateOnly === todayStr) totalDay += app.price;
                
                // Ganancia del Mes
                if (appDate >= startOfMonth) {
                    totalMonth += app.price;
                }

                // Ganancia de la Semana
                if (appDate >= startOfWeek) {

        // 4b. VISTA FINANZAS - HISTORIAL (REPORTE DE FACTURACIÓN MENSUAL)
        const renderFinanzasHistorial = (container) => {
            // 1. Filtrar solo citas completadas
            const completedAppointments = appointments.filter(a => a.status === 'completed');
            
            // 2. Agrupar por mes (YYYY-MM) y sumar la ganancia
            const monthlyRevenue = completedAppointments.reduce((acc, app) => {
                // app.date es YYYY-MM-DD. Tomamos YYYY-MM
                const monthKey = app.date.substring(0, 7); 
                acc[monthKey] = (acc[monthKey] || 0) + app.price;
                return acc;
            }, {});

            // 3. Convertir a un array de objetos y ordenar (Mes más reciente primero)
            let monthlyArray = Object.keys(monthlyRevenue).map(key => ({
                monthKey: key,
                totalRevenue: monthlyRevenue[key]

                            <button onclick="showMonthDetail('${item.monthKey}')" class="w-full py-3 flex justify-between items-center px-3 hover:bg-pink-50 rounded-lg transition duration-150 text-left">
                                <div class="flex flex-col">
                                    <span class="text-sm font-semibold text-gray-800 capitalize">${formattedMonth}</span>
                                    <span class="text-xs text-gray-400">Ganancia Facturada · Toca para ver detalle</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xl font-bold text-teal-600">${formatCurrency(item.totalRevenue)}</span>
                                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                                </div>
                            </button>
                        </li>
                    `;
                });
            }


            container.innerHTML = `
                <div class="space-y-4 pt-2">
                    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
                        <h3 class="text-lg font-semibold text-pink-500 mb-3 flex items-center gap-2">
                            <i data-lucide="history" class="w-5 h-5 text-pink-500"></i> Reporte Mensual
                        </h3>
                        <p class="text-xs text-gray-500 mb-3">Total de ingresos por mes, basado solo en citas **Completadas**.</p>
                        
                        <ul id="monthly-history-list" class="divide-y divide-gray-100 max-h-96 overflow-y-auto hide-scrollbar">
                            ${listHTML}
                        </ul>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        // --- DETALLE DE UN MES ESPECÍFICO (desglose de citas y por profesional) ---
        window.showMonthDetail = (monthKey) => {
            const monthAppointments = appointments
                .filter(a => a.status === 'completed' && a.date.substring(0, 7) === monthKey)
                .sort((a, b) => b.timestamp - a.timestamp);

            if (monthAppointments.length === 0) return;

            const totalRevenue = monthAppointments.reduce((sum, a) => sum + a.price, 0);
            const totalCitas = monthAppointments.length;
            const avgTicket = totalRevenue / totalCitas;

            // Desglose por profesional dentro de este mes
            const staffBreakdown = {};
            monthAppointments.forEach(a => {
                const name = a.staff || 'Sin asignar';
                staffBreakdown[name] = (staffBreakdown[name] || 0) + a.price;
            });
            const staffBreakdownHTML = Object.entries(staffBreakdown)
                .sort((a, b) => b[1] - a[1])
                .map(([name, total]) => `
                    <div class="flex justify-between text-xs text-gray-600 py-1">
                        <span>${name}</span>
                        <span class="font-semibold">${formatCurrency(total)}</span>
                    </div>
                `).join('');

            // Desglose por método de pago dentro de este mes
            let monthCash = 0;
            let monthTransfer = 0;
            let monthUnspecified = 0;
            monthAppointments.forEach(a => {
                if (a.paymentMethod === 'efectivo') monthCash += a.price;
                else if (a.paymentMethod === 'transferencia') monthTransfer += a.price;
                else monthUnspecified += a.price;
            });

            document.getElementById('monthDetailHeader').innerHTML = `
                <div class="bg-white/20 p-2.5 rounded-full mb-2">
                    <i data-lucide="calendar-check" class="w-6 h-6 text-white"></i>
                </div>
                <h3 class="text-white font-bold text-lg capitalize">${formatMonthYear(monthKey)}</h3>
                <p class="text-white/80 text-xs">${totalCitas} cita${totalCitas !== 1 ? 's' : ''} completada${totalCitas !== 1 ? 's' : ''}</p>
            `;

            document.getElementById('monthDetailBody').innerHTML = `
                <div class="bg-teal-50 border border-teal-100 rounded-xl p-4 text-center">
                    <p class="text-xs text-teal-700 font-medium">Ganancia total del mes</p>
                    <p class="text-2xl font-bold text-teal-600">${formatCurrency(totalRevenue)}</p>
                    <p class="text-[11px] text-gray-400 mt-1">Ticket promedio: ${formatCurrency(avgTicket)}</p>
                </div>

                <div class="bg-white border border-gray-100 rounded-xl p-3">
                    <p class="text-xs font-semibold text-gray-600 mb-2">Efectivo vs Transferencia (este mes)</p>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-green-50 border border-green-100 rounded-lg p-2.5">
                            <div class="flex items-center gap-1 text-green-700"><i data-lucide="banknote" class="w-3.5 h-3.5"></i><span class="text-[11px] font-semibold">Efectivo</span></div>
                            <p class="text-sm font-bold text-green-700 mt-0.5">${formatCurrency(monthCash)}</p>
                        </div>
                        <div class="bg-blue-50 border border-blue-100 rounded-lg p-2.5">
                            <div class="flex items-center gap-1 text-blue-700"><i data-lucide="landmark" class="w-3.5 h-3.5"></i><span class="text-[11px] font-semibold">Transferencia</span></div>
                            <p class="text-sm font-bold text-blue-700 mt-0.5">${formatCurrency(monthTransfer)}</p>
                        </div>
                    </div>
                    ${monthUnspecified > 0 ? `<p class="text-[10px] text-gray-400 mt-2">+ ${formatCurrency(monthUnspecified)} sin método especificado</p>` : ''}
                </div>

                ${staffBreakdownHTML ? `
                <div class="bg-pink-50 border border-pink-100 rounded-xl p-3">
                    <p class="text-xs font-semibold text-pink-600 mb-1">Producción por profesional</p>
                    ${staffBreakdownHTML}
                </div>` : ''}

                <div>
                    <p class="text-xs font-semibold text-gray-500 mb-2">Citas del mes</p>
                    <div class="space-y-2">
                        ${monthAppointments.map(a => `
                            <div class="flex justify-between items-center border-b border-gray-100 pb-2 last:border-0">
                                <div>
                                    <p class="text-xs font-medium text-gray-700">${a.client}</p>
                                    <p class="text-[11px] text-gray-400">${new Date(a.timestamp).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} · ${formatTime12(a.time)} · ${a.serviceName}</p>
                                </div>
                                <p class="text-xs font-bold text-gray-700">${formatCurrency(a.price)}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            const modal = document.getElementById('monthDetailModal');
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.querySelector('div').classList.remove('scale-95');
            lucide.createIcons();
        };

        window.hideMonthDetailModal = () => {
            const modal = document.getElementById('monthDetailModal');
            modal.classList.add('pointer-events-none', 'opacity-0');
            modal.querySelector('div').classList.add('scale-95');
        };
        // --- REGISTRO DEL SERVICE WORKER + SISTEMA DE ACTUALIZACIONES ---
        // IMPORTANTE: tus citas, clientas y finanzas viven en localStorage, que es un almacenamiento
        // completamente aparte del caché del Service Worker. Actualizar o incluso borrar el caché
        // de la app NUNCA borra tus datos guardados.
        const APP_VERSION = '1.4.0';
        let swRegistration = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => {
                        swRegistration = reg;
                        console.log('Service Worker registrado:', reg.scope);

                        // Si detecta una versión nueva instalándose, avisamos discretamente
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            if (!newWorker) return;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showUpdateBanner();
                                }
                            });
                        });
                    })
                    .catch(err => console.warn('No se pudo registrar el Service Worker:', err));
            });
        }

        // Banner discreto de "hay una nueva versión" (no interrumpe lo que la usuaria esté haciendo)
        const showUpdateBanner = () => {
            if (document.getElementById('updateBanner')) return; // ya se está mostrando
            const banner = document.createElement('div');
            banner.id = 'updateBanner';
            banner.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-50 flex items-center gap-2';
            banner.innerHTML = `<i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-400"></i> Nueva versión lista <button class="underline font-semibold ml-1">Actualizar</button>`;
            banner.querySelector('button').onclick = () => window.forceUpdate();
            document.body.appendChild(banner);
            lucide.createIcons();
        };

        // Botón manual en Configuración: fuerza a traer la última versión del código sin tocar tus datos
        window.forceUpdate = async () => {
            showToast('Buscando la última versión...');
            try {
                // 1. Borrar los cachés del Service Worker (NO afecta localStorage / tus citas)
                const cacheKeys = await caches.keys();
                await Promise.all(cacheKeys.filter(k => k.startsWith('gabycejas-cache')).map(k => caches.delete(k)));

                // 2. Forzar revisión de una nueva versión del service worker
                if (swRegistration) {
                    await swRegistration.update();
                }

                showToast('¡Actualizada! Recargando...');
                setTimeout(() => window.location.reload(), 700);
            } catch (err) {
                console.error('Error al actualizar:', err);
                showToast('No se pudo actualizar. Revisa tu conexión a internet.');
            }
        };

        // 4c. VISTA FINANZAS - EQUIPO (PRODUCCIÓN POR PROFESIONAL)
        const renderFinanzasEquipo = (container) => {
            const completedAppointments = appointments.filter(a => a.status === 'completed');

            const staffStats = {};
            completedAppointments.forEach(app => {
                const name = app.staff || 'Sin asignar';
                if (!staffStats[name]) {
                    staffStats[name] = { name: name, count: 0, totalRevenue: 0 };
                }
                staffStats[name].count++;
                staffStats[name].totalRevenue += app.price;
            });

            const staffArray = Object.values(staffStats).sort((a, b) => b.totalRevenue - a.totalRevenue);

            let listHTML = '';
            if (staffArray.length === 0) {
                listHTML = `
                    <div class="flex flex-col items-center justify-center h-40 text-gray-400">
                        <i data-lucide="user-cog" class="w-12 h-12 mb-2"></i>
                        <p>Aún no hay citas completadas asignadas a un profesional.</p>
                    </div>
                `;
            } else {
                staffArray.forEach((s, index) => {
                    const rankBadge = index === 0 ? `<i data-lucide="crown" class="w-4 h-4 inline text-yellow-500 mr-1"></i>` : '';
                    listHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                            <div class="flex items-center">
                                <div class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-pink-600 font-bold mr-3 text-sm">
                                    ${s.name.substring(0, 2).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-800 text-sm flex items-center">${rankBadge}${s.name}</h3>
                                    <p class="text-gray-400 text-xs mt-0.5">${s.count} cita${s.count !== 1 ? 's' : ''} completada${s.count !== 1 ? 's' : ''}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-teal-600 text-lg">${formatCurrency(s.totalRevenue)}</p>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <div class="space-y-3 pt-2">
                    <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
                        <h3 class="text-lg font-semibold text-pink-500 mb-1 flex items-center gap-2">
                            <i data-lucide="user-cog" class="w-5 h-5 text-pink-500"></i> Producción por Profesional
                        </h3>
                        <p class="text-xs text-gray-500 mb-3">Ganancia generada por cada persona del equipo, basada en citas **Completadas**.</p>
                    </div>
                    ${listHTML}
                </div>
            `;
            lucide.createIcons();
        };

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            initAudio();
            // Iniciar la aplicación en la vista de Agenda
            router('agenda');
        });

    </script>
</body>
</html>
